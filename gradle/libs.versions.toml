[versions]
# Build
androidGradlePlugin       = "9.5.0"
kotlin                    = "2.4.21"
ksp                       = "2.3.12"

# AndroidX
androidxRoom              = "2.8.5"

# Compose
androidxComposeBom        = "2026.09.00"

# DI
hilt                      = "2.60.1"
hiltExt                   = "1.4.0"

# Network
okhttp                    = "5.5.1"
kotlinxSerializationJson  = "1.12.0"
retrofitSerializer        = "1.0.0"

# Image
coil                      = "3.6.3"

# Local HTTP Server
nanohttpd                 = "2.3.1"

[libraries]
# Compose BOM
androidx-compose-bom                  = { group = "androidx.compose",           name = "compose-bom",         version.ref = "androidxComposeBom" }
androidx-compose-ui-tooling-preview   = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
androidx-compose-material3            = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core  = { group = "androidx.compose.material",  name = "material-icons-core" }
androidx-compose-ui-tooling           = { group = "androidx.compose.ui",        name = "ui-tooling" }

# Room
androidx-room-runtime                 = { group = "androidx.room", name = "room-runtime",  version.ref = "androidxRoom" }
androidx-room-compiler                = { group = "androidx.room", name = "room-compiler", version.ref = "androidxRoom" }

# Hilt
hilt-android                          = { group = "com.google.dagger", name = "hilt-android",            version.ref = "hilt" }
hilt-android-compiler                 = { group = "com.google.dagger", name = "hilt-android-compiler",   version.ref = "hilt" }
hilt-navigation-compose               = { group = "androidx.hilt",     name = "hilt-navigation-compose", version.ref = "hiltExt" }

# Network
okhttp-logging                        = { group = "com.squareup.okhttp3",     name = "logging-interceptor",                  version.ref = "okhttp" }
kotlinx-serialization-json            = { group = "org.jetbrains.kotlinx",    name = "kotlinx-serialization-json",           version.ref = "kotlinxSerializationJson" }
retrofit-kotlin-serialization         = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerializer" }

# Coil
coil-compose                          = { group = "io.coil-kt.coil3", name = "coil-compose",        version.ref = "coil" }
coil-network-okhttp                   = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# Local HTTP Server
nanohttpd                             = { group = "org.nanohttpd",    name = "nanohttpd",            version.ref = "nanohttpd" }

[plugins]
android-application   = { id = "com.android.application",                   version.ref = "androidGradlePlugin" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                  = { id = "com.google.dagger.hilt.android",            version.ref = "hilt" }
ksp                   = { id = "com.google.devtools.ksp",                   version.ref = "ksp" }
